[platformio]
default_envs = esp32-master, esp32-slave

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L

; ============================================================================
; 1. ENVIRONMENT ESP32 MASTER
; ============================================================================
[env:esp32-master]
board_build.partitions = min_spiffs.csv
build_src_filter =
    -<*>
    +<master/>
    +<devices/rgb_indicator.cpp>
    +<devices/alarm_buzzer.cpp>
    +<devices/env_sensors.cpp>
    +<fsm/>
    +<network/>
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4

; ============================================================================
; 2. ENVIRONMENT ESP32 SLAVE
; ============================================================================
[env:esp32-slave]
build_src_filter =
    -<*>
    +<slave/>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
