name: ESP32 Automated OTA CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-ota:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build Firmware ESP32 Master
        run: |
          pio run -e esp32-master

      - name: Prepare Release Asset
        id: prep
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          mkdir -p dist
          cp .pio/build/esp32-master/firmware.bin dist/firmware-master-${VERSION}.bin
          cp .pio/build/esp32-master/firmware.bin dist/firmware-master-latest.bin
          echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/${VERSION}/firmware-master-${VERSION}.bin" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Warehouse Firmware Release ${{ steps.prep.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            dist/firmware-master-${{ steps.prep.outputs.tag }}.bin
            dist/firmware-master-latest.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger ESP32 OTA via MQTT
        env:
          MQTT_BROKER: ${{ secrets.MQTT_BROKER || 'k4366bfc.ala.asia-southeast1.emqxsl.com' }}
          MQTT_PORT: ${{ secrets.MQTT_PORT || 8883 }}
          MQTT_USER: ${{ secrets.MQTT_USER || 'iwakdantempe' }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD || 'admin123' }}
          MQTT_TOPIC: "warehouse/small_warehouse/ota/update"
          RELEASE_TAG: ${{ steps.prep.outputs.tag }}
          DOWNLOAD_URL: ${{ steps.prep.outputs.DOWNLOAD_URL }}
        run: |
          python - << 'EOF'
          import os, ssl, json, sys
          import paho.mqtt.client as mqtt

          broker = os.environ.get("MQTT_BROKER")
          port = int(os.environ.get("MQTT_PORT", 8883))
          user = os.environ.get("MQTT_USER")
          pw = os.environ.get("MQTT_PASSWORD")
          topic = os.environ.get("MQTT_TOPIC")
          tag = os.environ.get("RELEASE_TAG")
          url = os.environ.get("DOWNLOAD_URL")

          payload = json.dumps({
              "version": tag,
              "url": url
          })

          print(f"[CI/CD OTA] Menghubungkan ke broker {broker}:{port}...")
          client = mqtt.Client(client_id="github_actions_ota_trigger", callback_api_version=mqtt.CallbackAPIVersion.VERSION2)
          if user and pw:
              client.username_pw_set(user, pw)

          if port == 8883:
              client.tls_set(cert_reqs=ssl.CERT_NONE)
              client.tls_insecure_set(True)

          client.connect(broker, port, 60)
          client.loop_start()
          msg_info = client.publish(topic, payload, qos=1)
          msg_info.wait_for_publish(timeout=10)
          client.loop_stop()
          client.disconnect()

          print(f"[CI/CD OTA] Berhasil mengirim sinyal OTA ke ESP32 pada topik '{topic}':")
          print(f"  {payload}")
          EOF
